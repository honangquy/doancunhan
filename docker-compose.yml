
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
    container_name: huit_app
    restart: unless-stopped
    working_dir: /var/www
    env_file:
      - .env
    environment:
      # Force in-network hostnames so Laravel can reach DB/Redis containers.
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE:-laravel}
      DB_USERNAME: ${MYSQL_USER:-laravel}
      DB_PASSWORD: ${MYSQL_PASSWORD:-secret}
      REDIS_HOST: redis
      REDIS_PORT: ${REDIS_PORT:-6379}
      REDIS_PASSWORD: ${REDIS_PASSWORD:-null}
    volumes:
      - ./:/var/www
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - huit

  web:
    image: nginx:alpine
    container_name: huit_web
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8000}:80"
    volumes:
      - ./:/var/www
      - ./docker/nginx/app.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - huit

  db:
    image: mysql:8.0
    container_name: huit_db
    restart: unless-stopped
    # Force MySQL to treat all table names as lowercase.
    # This fixes the mismatch between PascalCase table creation (NguoiDung)
    # and lowercase foreign key references (nguoidung) that breaks on Linux.
    command: --lower-case-table-names=1
    ports:
      - "${DB_FORWARD_PORT:-3307}:3306"
    environment:
      # Read DB settings from .env (or use safe local defaults).
      MYSQL_DATABASE: ${DB_DATABASE:-laravel}
      MYSQL_USER: ${MYSQL_USER:-laravel}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-secret}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
    volumes:
      - huit_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${MYSQL_ROOT_PASSWORD:-root}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - huit

  redis:
    image: redis:alpine
    container_name: huit_redis
    restart: unless-stopped
    ports:
      - "${REDIS_FORWARD_PORT:-6380}:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - huit_redis_data:/data
    networks:
      - huit

volumes:
  huit_mysql_data:
  huit_redis_data:

networks:
  huit:
    driver: bridge
