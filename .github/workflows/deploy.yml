name: Deploy HUIT Conferences to VPS

on:
  push:
    branches: [ "main" ]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: SSH into VPS and Deploy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USERNAME }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            set -e

            # --- Configuration ---------------------------------------------------
            PROJECT_DIR="/var/www/qlyhoithao"   # <-- Sửa nếu đường dẫn khác
            COMPOSE_FILES="-f docker-compose.yml -f docker-compose.prod.yml"

            echo "========================================"
            echo "  Deploying HUIT Conferences"
            echo "  $(date '+%Y-%m-%d %H:%M:%S')"
            echo "========================================"

            cd "$PROJECT_DIR"

            # 1. Pull latest code
            echo "[1/5] Pulling latest code..."
            git reset --hard
            git pull origin main

            # 2. Stop running containers
            echo "[2/5] Stopping containers..."
            docker compose $COMPOSE_FILES down

            # 3. Rebuild and start containers
            echo "[3/5] Building and starting containers..."
            docker compose $COMPOSE_FILES up -d --build

            # 4. Wait for app container to be healthy, then clear caches
            echo "[4/5] Clearing old caches..."
            sleep 10
            docker exec huit_app php artisan optimize:clear

            # 5. Cleanup unused Docker images
            echo "[5/5] Cleaning up old images..."
            docker image prune -f

            echo "========================================"
            echo "  Deploy completed successfully!"
            echo "========================================"
