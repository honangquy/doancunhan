<!DOCTYPE html>
<html>
<head>
    <title>Test Review Form</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 p-8">
    <div class="max-w-2xl mx-auto bg-white p-6 rounded-lg shadow">
        <h1 class="text-2xl font-bold mb-4">Test Review Form Submission</h1>
        
        <form id="testForm" action="/reviewer/reviews/1/store" method="POST" onsubmit="return testSubmit(event)">
            <input type="hidden" name="_token" value="test-token">
            <input type="hidden" name="is_draft" value="0" id="isDraftField">
            
            <div class="mb-4">
                <label class="block mb-2">Score Novelty:</label>
                <select name="score_novelty" class="border p-2 rounded">
                    <option value="">-- Chọn --</option>
                    <option value="8">8</option>
                    <option value="9">9</option>
                </select>
            </div>
            
            <div class="mb-4">
                <label class="block mb-2">Score Relevance:</label>
                <select name="score_relevance" class="border p-2 rounded">
                    <option value="">-- Chọn --</option>
                    <option value="7">7</option>
                    <option value="8">8</option>
                </select>
            </div>
            
            <div class="mb-4">
                <label class="block mb-2">Score Technical Quality:</label>
                <select name="score_technical_quality" class="border p-2 rounded">
                    <option value="">-- Chọn --</option>
                    <option value="8">8</option>
                    <option value="9">9</option>
                </select>
            </div>
            
            <div class="mb-4">
                <label class="block mb-2">Score Presentation:</label>
                <select name="score_presentation" class="border p-2 rounded">
                    <option value="">-- Chọn --</option>
                    <option value="7">7</option>
                    <option value="8">8</option>
                </select>
            </div>
            
            <div class="mb-4">
                <label class="block mb-2">Score References:</label>
                <select name="score_references" class="border p-2 rounded">
                    <option value="">-- Chọn --</option>
                    <option value="6">6</option>
                    <option value="7">7</option>
                </select>
            </div>
            
            <div class="mb-4">
                <label class="block mb-2">Recommendation:</label>
                <div class="space-y-2">
                    <label><input type="radio" name="recommendation_code" value="ACCEPT"> Accept</label><br>
                    <label><input type="radio" name="recommendation_code" value="WEAK_ACCEPT"> Weak Accept</label><br>
                    <label><input type="radio" name="recommendation_code" value="REJECT"> Reject</label>
                </div>
            </div>
            
            <div class="mb-4">
                <label class="block mb-2">Detailed Comments:</label>
                <textarea name="detailed_comments" class="border p-2 rounded w-full h-32" placeholder="Nhập ít nhất 50 ký tự..."></textarea>
            </div>
            
            <div class="flex space-x-4">
                <button type="button" onclick="saveDraft()" class="bg-blue-500 text-white px-4 py-2 rounded">Lưu nháp</button>
                <button type="button" onclick="submitFinal()" class="bg-green-500 text-white px-4 py-2 rounded">Gửi phản biện chính thức</button>
            </div>
            
            <div id="debug" class="mt-4 p-4 bg-gray-100 rounded">
                <h3 class="font-bold">Debug Info:</h3>
                <div id="debugContent"></div>
            </div>
        </form>
    </div>
    
    <script>
    // Copy the exact JavaScript from create.blade.php
    function saveDraft() {
        document.getElementById('isDraftField').value = '1';
        console.log('Saving draft...');
        updateDebug('Saving draft with is_draft = 1');
        // document.getElementById('testForm').submit();
    }

    function submitFinal() {
        console.log('Starting final submission validation...');
        
        const scores = ['score_relevance', 'score_novelty', 'score_technical_quality', 'score_presentation', 'score_references'];
        let hasEmptyScore = false;
        
        scores.forEach(score => {
            const select = document.querySelector(`select[name="${score}"]`);
            const value = select.value;
            
            console.log(`Checking ${score}: value = "${value}"`);
            
            if (value === '' || value < 1 || value > 10) {
                hasEmptyScore = true;
                select.style.borderColor = '#ef4444';
                select.style.backgroundColor = '#fef2f2';
            } else {
                select.style.borderColor = '#e5e7eb';
                select.style.backgroundColor = 'white';
            }
        });

        const recommendation = document.querySelector('input[name="recommendation_code"]:checked');
        const comments = document.querySelector('textarea[name="detailed_comments"]').value.trim();
        
        console.log(`hasEmptyScore: ${hasEmptyScore}`);
        console.log(`recommendation: ${recommendation ? recommendation.value : 'null'}`);
        console.log(`comments length: ${comments.length}`);
        
        if (hasEmptyScore) {
            alert('⚠️ Vui lòng điền đầy đủ điểm số (1-10) cho tất cả các tiêu chí đánh giá.');
            updateDebug('Validation failed: Empty scores');
            return false;
        }
        
        if (!recommendation) {
            alert('⚠️ Vui lòng chọn khuyến nghị của bạn cho bài báo này.');
            updateDebug('Validation failed: No recommendation');
            return false;
        }
        
        if (comments.length < 50) {
            alert('⚠️ Vui lòng nhập ít nhất 50 ký tự cho phần nhận xét chi tiết.');
            updateDebug('Validation failed: Comments too short');
            return false;
        }
        
        updateDebug('All validation passed! Ready to submit.');
        
        // Final confirmation
        const confirmMessage = `🔒 Xác nhận gửi phản biện chính thức\n\n` +
                              `Bạn có chắc chắn muốn gửi phản biện này không?\n\n` +
                              `⚠️ LưU Ý: Sau khi gửi, bạn sẽ KHÔNG THỂ chỉnh sửa nội dung phản biện.\n\n` +
                              `Vui lòng kiểm tra kỹ tất cả thông tin trước khi xác nhận.`;
        
        if (confirm(confirmMessage)) {
            document.getElementById('isDraftField').value = '0';
            updateDebug('User confirmed! Setting is_draft = 0 and submitting...');
            // document.getElementById('testForm').submit();
            console.log('Form would be submitted now');
        } else {
            updateDebug('User cancelled submission');
        }
    }
    
    function updateDebug(message) {
        const debugContent = document.getElementById('debugContent');
        const timestamp = new Date().toLocaleTimeString();
        debugContent.innerHTML += `<div>[${timestamp}] ${message}</div>`;
    }
    
    function testSubmit(event) {
        event.preventDefault();
        updateDebug('Form submission prevented for testing');
        return false;
    }
    </script>
</body>
</html>
