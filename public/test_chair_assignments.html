<!DOCTYPE html>
<html>
<head>
    <title>Test Chair Assignments</title>
</head>
<body>
    <h1>Testing Chair Assignments Page</h1>
    
    <div id="test-results"></div>
    
    <script>
        async function testChairPage() {
            const results = document.getElementById('test-results');
            results.innerHTML = '<p>Testing...</p>';
            
            try {
                // Test chair assignments page
                const response = await fetch('/chair/assignments', {
                    headers: {
                        'Accept': 'text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8'
                    }
                });
                
                if (response.ok) {
                    const html = await response.text();
                    results.innerHTML = '<p style="color: green;">✅ Chair assignments page loaded successfully</p>';
                    
                    // Check if there are JSON errors in the HTML
                    if (html.includes('json_decode')) {
                        results.innerHTML += '<p style="color: red;">❌ Found json_decode error in HTML</p>';
                        
                        // Extract the error context
                        const errorMatch = html.match(/json_decode[^<]*[^>]*>/);
                        if (errorMatch) {
                            results.innerHTML += '<pre style="background: #ffeeee; padding: 10px;">' + 
                                                 errorMatch[0] + '</pre>';
                        }
                    } else {
                        results.innerHTML += '<p style="color: green;">✅ No JSON decode errors found</p>';
                    }
                    
                } else {
                    results.innerHTML = '<p style="color: red;">❌ Failed to load page: ' + response.status + '</p>';
                }
            } catch (error) {
                results.innerHTML = '<p style="color: red;">❌ Error: ' + error.message + '</p>';
            }
        }
        
        // Run test when page loads
        window.onload = testChairPage;
    </script>
</body>
</html>
