<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Alpine.js Data</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
</head>
<body class="bg-gray-100 p-8">
    <div class="max-w-4xl mx-auto">
        <h1 class="text-2xl font-bold mb-6">Test Alpine.js với 69 Reviewers</h1>
        
        <!-- Alpine.js component -->
        <div x-data="{
            searchQuery: '',
            reviewers: [
                { user_id: 25, full_name: 'Reviewer User 25', email: 'reviewer25@huit.edu.vn', organization: 'HUIT', workload: 0 },
                { user_id: 26, full_name: 'Reviewer User 26', email: 'reviewer26@huit.edu.vn', organization: 'HUIT', workload: 1 },
                { user_id: 27, full_name: 'Reviewer User 27', email: 'reviewer27@huit.edu.vn', organization: 'HUIT', workload: 1 }
            ],
            
            get filteredReviewers() {
                if (!this.searchQuery) return this.reviewers;
                const query = this.searchQuery.toLowerCase();
                return this.reviewers.filter(r => 
                    r.full_name.toLowerCase().includes(query) || 
                    r.email.toLowerCase().includes(query)
                );
            }
        }" class="bg-white rounded-lg shadow p-6">
            
            <!-- Debug info -->
            <div class="mb-4 p-4 bg-blue-50 rounded">
                <p class="font-semibold">Debug Info:</p>
                <p>Total reviewers: <span x-text="reviewers.length"></span></p>
                <p>Filtered: <span x-text="filteredReviewers.length"></span></p>
                <p>Search: <span x-text="searchQuery || 'none'"></span></p>
            </div>
            
            <!-- Search -->
            <div class="mb-4">
                <input type="text" 
                       x-model="searchQuery"
                       placeholder="Tìm kiếm reviewer..."
                       class="w-full px-4 py-2 border rounded-lg">
            </div>
            
            <!-- List -->
            <div class="space-y-2">
                <template x-for="reviewer in filteredReviewers" :key="reviewer.user_id">
                    <div class="p-4 border rounded-lg hover:bg-gray-50">
                        <div class="font-semibold" x-text="reviewer.full_name"></div>
                        <div class="text-sm text-gray-600" x-text="reviewer.email"></div>
                        <div class="text-xs text-gray-500">
                            Workload: <span x-text="reviewer.workload"></span>
                        </div>
                    </div>
                </template>
            </div>
            
            <!-- Empty state -->
            <template x-if="filteredReviewers.length === 0">
                <div class="text-center py-8 text-gray-500">
                    Không tìm thấy reviewer
                </div>
            </template>
        </div>
    </div>
</body>
</html>
